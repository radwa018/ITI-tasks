{% extends 'base.html' %}

{% block title %}Trainees{% endblock %}

{% block content %}
<h1>All Trainees</h1>
<a href="{% url 'add_trainee' %}">➕ Insert New Trainee</a>
<table border="1" width="100%">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Track</th>
    </tr>
    {% for trainee in trainees %}
    <tr>
        <td>{{ trainee.id }}</td>
        <td>{{ trainee.name }}</td>
        <td>{{ trainee.age }}</td>
        <td>{{ trainee.track.name }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
