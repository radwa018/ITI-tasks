{% extends 'base.html' %}

{% block title %}Add Trainee{% endblock %}

{% block content %}
<h1>Insert New Trainee</h1>
<form method="post">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name" required><br><br>

    <label>Age:</label>
    <input type="number" name="age" required><br><br>

    <label>Track:</label>
    <select name="track" required>
        {% for track in tracks %}
        <option value="{{ track.id }}">{{ track.name }}</option>
        {% endfor %}
    </select><br><br>

    <button type="submit">Save</button>
</form>
{% endblock %}
